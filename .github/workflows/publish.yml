name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: validate credentials and ZIPs without submitting to stores"
        type: boolean
        default: false

# Gate, E2E, Zip and Submit only read the checkout and pass artifacts between
# themselves. `github-release` overrides this with `contents: write`, which it
# needs to attach the zips; keeping the default read-only everywhere else is
# what CodeQL's actions/missing-workflow-permissions asks for.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release path runs the SAME gate CI does, as one step. The previous
  # version of this workflow reimplemented the checks piecemeal — format here,
  # compile there, `pnpm test` (no coverage thresholds) in another job — which
  # is how the release path ended up diverging from what had been verified on
  # main. One command means one definition.
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # format · lint · types (src + e2e) · unit + coverage · coverage integrity
      # · locale parity · hardcoded text · relative units
      - name: Run fast gate
        run: pnpm verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ""

      - name: Check bundle size
        run: pnpm check:bundle-size

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  zip:
    name: Zip Extensions
    runs-on: ubuntu-latest
    needs: [gate, e2e-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip Chrome extension
        run: pnpm zip
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          WXT_SENTRY_DSN: ${{ secrets.WXT_SENTRY_DSN }}

      - name: List .output directory
        run: ls -la .output/

      # `.output/` is a hidden directory, and upload-artifact v4.4+ excludes
      # hidden files by default. Without this input the action reports "No
      # files were found" for a zip that plainly exists, which is what killed
      # the v1.6.0 and v1.6.1 releases.
      - name: Upload Chrome ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-zip
          path: .output/*-chrome.zip
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Zip Firefox extension
        run: pnpm zip:firefox
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          WXT_SENTRY_DSN: ${{ secrets.WXT_SENTRY_DSN }}

      - name: Upload Firefox ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-zip
          path: |
            .output/*-firefox.zip
            .output/*-sources.zip
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    needs: zip
    # `wxt submit` is publish-browser-extension v6. Since v5, Chrome uses the
    # v2 API with a service account; the v1.1 client/secret/refresh-token trio
    # is deprecated and stopped working on 2026-10-15. Credentials live at job
    # level so the checks and all four submit steps read the same names. The
    # CLI only configures a store when its ZIP is passed, so a Chrome-only
    # invocation ignores Firefox credentials and vice versa.
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      # Optional v2 controls. An empty string fails the CLI's validation, so
      # each submit step unsets the ones that are not configured.
      CHROME_CANCEL_PENDING: ${{ secrets.CHROME_CANCEL_PENDING }}
      CHROME_DEPLOY_PERCENTAGE: ${{ secrets.CHROME_DEPLOY_PERCENTAGE }}
      CHROME_PUBLISH_TYPE: ${{ secrets.CHROME_PUBLISH_TYPE }}
      CHROME_SKIP_REVIEW: ${{ secrets.CHROME_SKIP_REVIEW }}
      CHROME_SKIP_SUBMIT_REVIEW: ${{ secrets.CHROME_SKIP_SUBMIT_REVIEW }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Chrome ZIP
        uses: actions/download-artifact@v8
        with:
          name: chrome-zip
          path: .output/

      - name: Download Firefox ZIPs
        uses: actions/download-artifact@v8
        with:
          name: firefox-zip
          path: .output/

      # Store submission is optional per store: a tag cut with only one store's
      # credentials must still publish the other, and the release never waits
      # on either one. Each invocation passes only its own ZIP(s), so the CLI
      # ignores the other store's credentials even though they are job env.
      - name: Check store credentials
        id: creds
        run: |
          check_store() {
            store="$1"
            label="$2"
            shift 2
            missing=""
            for name in "$@"; do
              [ -n "${!name}" ] || missing="$missing $name"
            done
            if [ -n "$missing" ]; then
              echo "${store}=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$label submission skipped — missing secrets:$missing (see README > Required GitHub Secrets)"
            else
              echo "${store}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_store chrome Chrome \
            CHROME_EXTENSION_ID CHROME_PUBLISHER_ID \
            CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL \
            CHROME_SERVICE_ACCOUNT_PRIVATE_KEY
          check_store firefox Firefox \
            FIREFOX_EXTENSION_ID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET

      - name: Submit to Chrome (dry run)
        if: steps.creds.outputs.chrome == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          for name in CHROME_CANCEL_PENDING CHROME_DEPLOY_PERCENTAGE \
                      CHROME_PUBLISH_TYPE CHROME_SKIP_REVIEW \
                      CHROME_SKIP_SUBMIT_REVIEW; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm wxt submit --dry-run --chrome-zip .output/*-chrome.zip

      - name: Submit to Chrome
        if: steps.creds.outputs.chrome == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
        run: |
          for name in CHROME_CANCEL_PENDING CHROME_DEPLOY_PERCENTAGE \
                      CHROME_PUBLISH_TYPE CHROME_SKIP_REVIEW \
                      CHROME_SKIP_SUBMIT_REVIEW; do
            [ -n "${!name}" ] || unset "$name"
          done
          pnpm wxt submit --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox (dry run)
        if: steps.creds.outputs.firefox == 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          pnpm wxt submit --dry-run \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

      - name: Submit to Firefox
        if: steps.creds.outputs.firefox == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
        run: |
          pnpm wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: zip
    # Only create a real release on tag push; skip on manual dry-run dispatches
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Chrome ZIP
        uses: actions/download-artifact@v8
        with:
          name: chrome-zip
          path: release-assets/

      - name: Download Firefox ZIPs
        uses: actions/download-artifact@v8
        with:
          name: firefox-zip
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
