name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only reads the checkout and uploads an artifact. Without an
# explicit block the GITHUB_TOKEN inherits the repository default, which can be
# write — CodeQL flagged all three jobs for it (actions/missing-workflow-permissions).
permissions:
  contents: read

# A new push to a PR supersedes the previous run. Without this, queued runs can
# report against a commit that is no longer the branch head, which reads as a
# failure that nothing reproduces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The whole fast gate as ONE step, so CI and a developer run the same
      # checks in the same order and there is no fourth gate that exists only in
      # CI. Steps are listed in scripts/verify.mjs:
      #
      #   format · lint · types (src + e2e) · unit + coverage
      #   coverage integrity · locale parity · hardcoded text
      #
      - name: Run fast gate
        run: pnpm verify

      # Composite, so it has no runtime of its own — but its PR-comment step is
      # `actions/github-script@v7.0.1`, which does. v6 and v7 nest
      # github-script@v8 instead. Bumping only the "real" actions left this
      # warning behind on the Gate job.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ""

      # retries: 0. A retry hides a flake rather than fixing it.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [gate, e2e-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip Chrome extension
        run: pnpm zip
        env:
          SENTRY_AUTH_TOKEN: ""

      - name: Zip Firefox extension
        run: pnpm zip:firefox
        env:
          SENTRY_AUTH_TOKEN: ""

      # `.output/` is hidden, and upload-artifact excludes hidden files by
      # default. Without include-hidden-files these two steps have been
      # uploading nothing since the zips moved under `.output/`, and said so
      # only as a warning — the job stayed green with an artifact that did not
      # exist. `if-no-files-found: error` is what makes that visible.
      - name: Upload Chrome ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-zip
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload Firefox ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-zip
          path: |
            .output/*-firefox.zip
            .output/*-sources.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
