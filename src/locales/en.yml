extName: "Clipio: Snippets Manager"
extDescription: "A powerful browser extension for managing and inserting snippets with lightning speed and increase your productivity."

common:
  resizeSidebar: Resize sidebar
  cancel: Cancel
  closeModal: Close
  save: Save
  # Generic UI affordances, shared by the dialog, banner and sidebar primitives.
  dismiss: Dismiss
  dismissError: Dismiss error
  close: Close
  reload: Reload
  # Error-boundary copy. The two fallbacks differ only in what the user should
  # do next, so they need two strings rather than one generic apology.
  errorOptions: Something went wrong. Please reload the options page.
  errorPopup: Something went wrong. Please close and reopen the extension.

  # Editor placeholder chrome
  editor:
    dateFormat: Date Format
    cursorTitle: Cursor position - cursor will be placed here after insertion
    gifPickerLabel: GIF picker

dashboard:
  searchPlaceholder: Search snippets...
  loadingSnippets: Loading snippets...
  noSnippetsFound: No snippets found
  noSnippetsYet: No snippets yet
  tryDifferentSearch: Try a different search term
  importButton: Import snippets
  draftLabel: Untitled
  draftShortcut: /...
  addSnippet: Add Snippet
  settingsAndExport: Settings & Import/Export
  emptyState:
    heading: No snippets yet
    body: Create your first snippet to start saving and reusing text quickly.
    action: Create your first snippet
  snippetListLabel: Snippets
  warnings:
    quotaFull:
      body: Sync storage full — snippets saved locally only.
      action: Export backup →
    syncPaused:
      body: Sync paused — snippets are saved locally (switched manually).
      action: Storage settings →
    recovery:
      body:
        1: "Your synced snippets were lost (sign-out detected). 1 snippet in backup."
        n: "Your synced snippets were lost (sign-out detected). $1 snippets in backup."
      action:
        1: Restore 1 snippet
        n: Restore $1 snippets
    updateAvailable:
      body: "A new version of Clipio is available: $1"
      action: View release
  errors:
    failedToLoad: Failed to load snippets.
    failedToCreate: Failed to create snippet. Please try again.
    failedToRestore: Failed to restore snippets.
    failedToUpdate: Failed to update snippet. Please try again.
    # Quota explanations. $1 is the projected/actual size, $2 the limit.
    quotaExceeded: Sync storage is full, so this snippet was not saved.
    quotaPerItem: This snippet is $1 and sync allows $2 per snippet.
    quotaTotal: Your snippets total $1 and sync allows $2.
    quotaCount: You have $1 snippets and sync allows $2.

