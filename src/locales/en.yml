    previewEnabled:
      title: Snippet preview
      desc: Show a filterable menu of matching snippets as you type.
    previewPrefix:
      title: Trigger prefix
      desc: The character that opens the preview menu. Leave empty to always show it.
    previewShortcut:
      title: Preview shortcut
      desc: Open the full snippet list from the keyboard, without the prefix.
    typingTimeout:
      title: Typing timeout
      desc: How long Clipio waits after you stop typing before expanding. Lower is faster but can fire mid-word.
    blockedSites:
      title: Blocked sites
      desc: Snippet expansion is disabled on these sites. Add them from the page context menu.
    theme:
      title: Theme
      desc: Follow the system setting, or pin Clipio to light or dark.
    fontFamily:
      title: Interface font
      desc: The typeface Clipio uses everywhere. Monospace text, like the debug log, always stays monospaced.
    confetti:
      title: Confetti on insert
      desc: Fire a confetti burst each time a snippet is inserted.
    storageMode:
      title: Where snippets are stored
      desc: Sync keeps snippets on every device through your browser account. Local is this device only, with a much higher limit.
    debugMode:
      title: Debug logging
      desc: Record extension activity to an inspectable log.
    giphyKey:
