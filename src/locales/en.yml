extName: "Clipio: Snippets Manager"
extDescription: "A powerful browser extension for managing and inserting snippets with lightning speed and increase your productivity."

common:
  hideSidebar: Hide sidebar
  showSidebar: Show sidebar
  resizeSidebar: Resize sidebar
  cancel: Cancel
  closeModal: Close
  save: Save
  # Generic UI affordances, shared by the dialog, banner and sidebar primitives.
  # spec: specs/i18n.spec.md
  dismiss: Dismiss
  dismissError: Dismiss error
  toggleSidebar: Toggle sidebar
  close: Close
  reload: Reload
  # Error-boundary copy. The two fallbacks differ only in what the user should
  # do next, so they need two strings rather than one generic apology.
  errorOptions: Something went wrong. Please reload the options page.
  errorPopup: Something went wrong. Please close and reopen the extension.

  # Editor placeholder chrome
  editor:
    dateFormat: Date Format
    cursorTitle: Cursor position - cursor will be placed here after insertion
    gifPickerLabel: GIF picker

